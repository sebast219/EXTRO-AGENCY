name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Los cuatro pasos son bloqueantes y corren siempre, incluso si uno falla:
      # ver los cuatro resultados de una vez ahorra un ciclo completo de CI.
      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Pruebas unitarias
        if: '!cancelled()'
        run: npm run test

      - name: Build
        if: '!cancelled()'
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e
        env:
          # Los correos se registran en el log en vez de enviarse: los recorridos
          # de reserva y contacto no pueden depender de Resend ni gastar cuota.
          MAIL_DRY_RUN: '1'
          NODE_ENV: development
          NEXT_PUBLIC_FOMO_SLOTS: '0'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
